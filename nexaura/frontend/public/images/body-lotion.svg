<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#D81B60" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="220" fill="#FFFFFF" opacity="0.7" />
  
  <!-- Base Shadow -->
  <ellipse cx="300" cy="480" rx="100" ry="20" fill="#D81B60" opacity="0.15" />
  
  <!-- Body Lotion Bottle -->
  <rect x="210" y="180" width="180" height="280" rx="50" fill="url(#bottleGrad)" stroke="#F8BBD0" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Dispenser Pump -->
  <rect x="275" y="130" width="50" height="50" fill="#F48FB1" rx="8" />
  <rect x="250" y="110" width="100" height="25" fill="#E91E63" rx="10" />
  <path d="M 250 120 L 210 120 L 210 135 L 250 130 Z" fill="#C2185B" />

  <!-- Bottle Label -->
  <rect x="230" y="250" width="140" height="150" rx="18" fill="#FFF5F7" stroke="#E91E63" stroke-width="2" />
  <text x="300" y="290" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#C2185B" text-anchor="middle" letter-spacing="2">SKINORA</text>
  <text x="300" y="315" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#E91E63" text-anchor="middle">KUMKUMADI &amp; GOAT MILK</text>
  <text x="300" y="335" font-family="'Poppins', sans-serif" font-size="9" fill="#880E4F" text-anchor="middle">WHITENING BODY LOTION</text>
  <text x="300" y="355" font-family="'Poppins', sans-serif" font-size="9" fill="#D81B60" text-anchor="middle">24H MOISTURE LOCK</text>
  <text x="300" y="380" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#D81B60" text-anchor="middle">250 ml</text>
</svg>
