<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8BBD0" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#C2185B" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="220" fill="#FFFFFF" opacity="0.7" />
  
  <!-- Base Shadow -->
  <ellipse cx="300" cy="450" rx="140" ry="25" fill="#C2185B" opacity="0.15" />
  
  <!-- Scrub Clay Jar Body -->
  <rect x="180" y="250" width="240" height="180" rx="40" fill="url(#jarGrad)" stroke="#F8BBD0" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Jar Lid -->
  <rect x="160" y="210" width="280" height="50" rx="15" fill="url(#lidGrad)" />
  <rect x="175" y="220" width="250" height="12" rx="6" fill="#FFFFFF" opacity="0.3" />
  
  <!-- Gold Label -->
  <rect x="200" y="280" width="200" height="120" rx="15" fill="#FFF5F7" stroke="#E91E63" stroke-width="2" />
  <text x="300" y="315" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#C2185B" text-anchor="middle" letter-spacing="2">SKINORA</text>
  <text x="300" y="340" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#E91E63" text-anchor="middle" letter-spacing="2">SAFFRON &amp; HONEY</text>
  <text x="300" y="360" font-family="'Poppins', sans-serif" font-size="11" fill="#880E4F" text-anchor="middle">DE-TAN FACE SCRUB</text>
  <text x="300" y="380" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#D81B60" text-anchor="middle">100g • ORGANIC</text>

  <!-- Honey Drops Decorative -->
  <circle cx="150" cy="180" r="14" fill="#FFC107" opacity="0.8" />
  <circle cx="450" cy="400" r="18" fill="#FFC107" opacity="0.7" />
</svg>
