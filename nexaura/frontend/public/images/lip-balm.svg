<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="potGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8BBD0" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <linearGradient id="potGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F48FB1" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#C2185B" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="220" fill="#FFFFFF" opacity="0.7" />
  
  <!-- Base Shadows -->
  <ellipse cx="230" cy="420" rx="90" ry="20" fill="#C2185B" opacity="0.15" />
  <ellipse cx="370" cy="420" rx="90" ry="20" fill="#C2185B" opacity="0.15" />
  
  <!-- Left Glass Pot (Scrub) -->
  <circle cx="230" cy="320" r="90" fill="url(#potGrad1)" filter="url(#dropShadow)" />
  <circle cx="230" cy="320" r="75" fill="#FFFFFF" opacity="0.3" />
  <text x="230" y="315" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SKINORA</text>
  <text x="230" y="335" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">ROSE SCRUB</text>
  
  <!-- Right Glass Pot (Balm) -->
  <circle cx="370" cy="320" r="90" fill="url(#potGrad2)" filter="url(#dropShadow)" />
  <circle cx="370" cy="320" r="75" fill="#FFFFFF" opacity="0.3" />
  <text x="370" y="315" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SKINORA</text>
  <text x="370" y="335" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">LIP BALM</text>
  
  <!-- Rose Petals -->
  <path d="M 130 220 Q 160 180 200 210 Q 160 250 130 220 Z" fill="#E91E63" opacity="0.8" />
  <path d="M 470 220 Q 440 180 400 210 Q 440 250 470 220 Z" fill="#E91E63" opacity="0.8" />
</svg>
