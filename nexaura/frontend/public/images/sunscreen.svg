<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFF176" />
      <stop offset="100%" stop-color="#FBC02D" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#F57F17" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="220" fill="#FFFFFF" opacity="0.7" />
  
  <!-- Base Shadow -->
  <ellipse cx="300" cy="480" rx="90" ry="18" fill="#F57F17" opacity="0.15" />
  
  <!-- Sunscreen Tube Body -->
  <path d="M 230 180 L 370 180 C 385 180 395 240 380 380 C 370 440 350 450 300 450 C 250 450 230 440 220 380 C 205 240 215 180 230 180 Z" fill="url(#sunGrad)" filter="url(#dropShadow)" />
  
  <!-- Tube Top Crimped Edge -->
  <rect x="220" y="160" width="160" height="25" fill="#F57F17" rx="5" />
  
  <!-- Tube Cap -->
  <rect x="250" y="445" width="100" height="35" rx="8" fill="#FFFFFF" stroke="#FBC02D" stroke-width="3" />

  <!-- Label -->
  <rect x="240" y="240" width="120" height="140" rx="12" fill="#FFFFFF" opacity="0.95" />
  <text x="300" y="275" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#F57F17" text-anchor="middle" letter-spacing="2">SKINORA</text>
  <text x="300" y="295" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#E65100" text-anchor="middle">SPF 50 PA++++</text>
  <text x="300" y="315" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#F57F17" text-anchor="middle">INVISIBLE GEL</text>
  <text x="300" y="332" font-family="'Poppins', sans-serif" font-size="8" fill="#8D6E63" text-anchor="middle">0% WHITE CAST</text>
  <text x="300" y="355" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#E65100" text-anchor="middle">50g</text>

  <!-- Sun Rays Motif -->
  <circle cx="300" cy="120" r="22" fill="#FBC02D" opacity="0.8" />
</svg>
