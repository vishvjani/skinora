<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShampoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC" />
      <stop offset="100%" stop-color="#FFF5F7" />
    </linearGradient>
    <linearGradient id="shampooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgShampoo)" />
  <circle cx="300" cy="300" r="210" fill="#FFFFFF" opacity="0.8" />
  
  <ellipse cx="300" cy="480" rx="140" ry="25" fill="#C2185B" opacity="0.15" />
  
  <!-- Shampoo Bottle Base -->
  <rect x="200" y="200" width="200" height="260" rx="45" fill="url(#shampooGrad)" />
  <rect x="220" y="240" width="160" height="180" rx="20" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Label -->
  <text x="300" y="285" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#2C1A1D" text-anchor="middle">SKINORA</text>
  <text x="300" y="315" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#E91E63" text-anchor="middle" letter-spacing="2">RICE WATER</text>
  <text x="300" y="335" font-family="'Poppins', sans-serif" font-size="16" font-weight="bold" fill="#C2185B" text-anchor="middle">SHAMPOO</text>
  <text x="300" y="365" font-family="'Poppins', sans-serif" font-size="11" fill="#9E7582" text-anchor="middle">300 ML • HAIR GROWTH</text>
  <text x="300" y="390" font-family="'Poppins', sans-serif" font-size="10" fill="#E91E63" text-anchor="middle">Anti-Hairfall Formula</text>
  
  <!-- Pump Dispenser Cap -->
  <rect x="270" y="140" width="60" height="60" fill="#2C1A1D" rx="10" />
  <path d="M 270 140 L 230 140 L 230 115 L 300 115 L 300 140 Z" fill="#2C1A1D" />
</svg>
