<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8BBD0" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F48FB1" />
      <stop offset="100%" stop-color="#EC407A" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#D81B60" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="220" fill="#FFFFFF" opacity="0.7" />
  
  <!-- Shadow Base -->
  <ellipse cx="300" cy="480" rx="110" ry="20" fill="#D81B60" opacity="0.15" />
  
  <!-- Bottle Base & Body -->
  <rect x="210" y="180" width="180" height="280" rx="45" fill="url(#bottleGrad)" stroke="#F8BBD0" stroke-width="4" filter="url(#dropShadow)" />
  <rect x="220" y="250" width="160" height="190" rx="30" fill="url(#liquidGrad)" opacity="0.85" />
  
  <!-- Dispenser Pump -->
  <rect x="275" y="130" width="50" height="50" fill="#E91E63" rx="8" />
  <rect x="250" y="110" width="100" height="25" fill="#C2185B" rx="10" />
  <path d="M 250 120 L 210 120 L 210 135 L 250 130 Z" fill="#880E4F" />

  <!-- Bottle Label -->
  <rect x="235" y="280" width="130" height="130" rx="15" fill="#FFFFFF" opacity="0.95" />
  <text x="300" y="315" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#C2185B" text-anchor="middle" letter-spacing="2">SKINORA</text>
  <text x="300" y="338" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#E91E63" text-anchor="middle">DE-TAN BODY WASH</text>
  <text x="300" y="355" font-family="'Poppins', sans-serif" font-size="9" fill="#880E4F" text-anchor="middle">RICE WATER &amp; CHANDAN</text>
  <text x="300" y="380" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#D81B60" text-anchor="middle">300 ml</text>
</svg>
